[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-oidc-auth"
version = "0.1.0"
description = "Shared OIDC sign-in and OAuth delegation for Toolframe"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = ["toolframe-sdk==0.2.0", "authlib==1.8.0", "httpx2>=2.8,<3", "starlette>=1,<2", "cryptography>=44"]

[project.entry-points."toolframe.plugins"]
oidc-auth = "toolframe_oidc_auth.plugin:plugin"

[dependency-groups]
integration = ["fastmcp>=4,<5"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "toolframe-storage-sqlite==0.2.0", "toolframe-auth>=0.1.1,<0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
