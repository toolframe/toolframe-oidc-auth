[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-oidc-auth"
version = "0.3.1"
description = "Shared OIDC sign-in and OAuth delegation for Toolframe"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "byfb", email = "62798989+byfb@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = ["toolframe-sdk>=0.4,<0.5", "authlib==1.8.0", "httpx2>=2.8,<3", "starlette>=1,<2", "cryptography==50.0.2"]

[project.urls]
Homepage = "https://github.com/toolframe/toolframe-oidc-auth"
Repository = "https://github.com/toolframe/toolframe-oidc-auth"
Documentation = "https://github.com/toolframe/toolframe-oidc-auth#readme"
Issues = "https://github.com/toolframe/toolframe-oidc-auth/issues"

[project.entry-points."toolframe.plugins"]
oidc-auth = "toolframe_oidc_auth.plugin:plugin"

[dependency-groups]
integration = ["fastmcp>=4,<5"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "toolframe-sql-sqlite>=0.4.1,<0.5", "toolframe-auth>=0.3,<0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"

[tool.uv.sources]
toolframe-sdk = { path = "../toolframe-sdk", editable = true }
toolframe-sql-sqlite = { path = "../toolframe-sql-sqlite", editable = true }
toolframe-auth = { path = "../toolframe-auth", editable = true }
